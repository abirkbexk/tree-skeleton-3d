[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "treeskel"
version = "0.1.0"
description = "3D apple-tree skeleton extraction from RGB-D PNG images (MMA3001 individual project)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24", "scipy>=1.11", "pandas>=2.0", "scikit-learn>=1.3", "opencv-python-headless>=4.8",
    "matplotlib>=3.7", "tqdm>=4.66", "joblib>=1.3", "gdown>=5.0",
]

[project.optional-dependencies]
cnn = ["torch>=2.1"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "pytest-html>=4.0", "pdoc>=14.0"]

[project.scripts]
treeskel-train = "treeskel.cli:train_main"
treeskel-predict = "treeskel.cli:predict_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]
